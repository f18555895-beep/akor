<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Akor ölçer</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#edf0e9;--card:#f8f9f5;--ink:#1d2b25;--mute:#5d6b63;--acc:#2c4a7a;--good:#2f7d4e;--warn:#b7791f;--bad:#b4442f;--str:#9aa59d;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141c18;--card:#1c2621;--ink:#e6ece7;--mute:#9aa89f;--acc:#8fb0e6;--good:#5fc287;--warn:#e2b152;--bad:#e27a62;--str:#55635b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141c18;--card:#1c2621;--ink:#e6ece7;--mute:#9aa89f;--acc:#8fb0e6;--good:#5fc287;--warn:#e2b152;--bad:#e27a62;--str:#55635b;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.4}
main{max-width:460px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:1.5rem;margin:0 0 14px;font-weight:700;letter-spacing:-.01em}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:18px}
.chips button{font:inherit;font-weight:600;font-size:1rem;padding:11px 0;border-radius:10px;border:1.5px solid var(--str);background:transparent;color:var(--ink)}
.chips button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--bg)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.score{display:flex;align-items:baseline;gap:6px;margin:4px 0 2px}
.pct{font-size:6.5rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.sign{font-size:2.4rem;font-weight:600;color:var(--mute)}
.msg{min-height:2.8em;margin:0 0 14px;color:var(--mute);font-size:1rem}
.board{background:var(--card);border-radius:14px;padding:14px 14px 10px;margin-bottom:18px}
.row{display:grid;grid-template-columns:3.1rem 1fr 3.6rem;align-items:center;gap:10px;padding:9px 0}
.row .n{font-weight:600;font-size:.95rem}
.row .n small{color:var(--mute);font-weight:400}
.row .l{height:var(--w);border-radius:3px;background:var(--str);transition:background .25s}
.row .t{text-align:right;font-size:.85rem;color:var(--mute);font-variant-numeric:tabular-nums}
.row.ok .l{background:var(--good)}.row.ok .t{color:var(--good)}
.row.warn .l{background:var(--warn)}.row.warn .t{color:var(--warn)}
.row.miss .l{background:transparent;border-top:2px dashed var(--bad);height:0}.row.miss .t{color:var(--bad)}
.row.mute{opacity:.4}.row.mute .l{background:transparent;border-top:2px dotted var(--str);height:0}
.go{width:100%;font:inherit;font-weight:700;font-size:1.1rem;padding:15px;border:0;border-radius:12px;background:var(--ink);color:var(--bg)}
.go[aria-pressed=true]{background:var(--bad);color:#fff}
.note{font-size:.8rem;color:var(--mute);margin-top:12px}
</style>
</head>
<body>
<main>
<h1>Akor ölçer</h1>
<div class="chips" id="chips"></div>
<div class="score"><span class="pct" id="pct">–</span><span class="sign">%</span></div>
<p class="msg" id="msg">Dinlemeyi başlat, sonra akoru çal.</p>
<div class="board" id="board"></div>
<button class="go" id="go" aria-pressed="false">Dinlemeyi başlat</button>
<p class="note">Gitarı akortlu tut, telefonu gitara yakın koy. Akoru bir kez çal, sonucu 1–2 saniyede gösterir.</p>
</main>
<script>
const OPEN=[40,45,50,55,59,64];
const CH={Em:[0,2,2,0,0,0],Am:[null,0,2,2,1,0],F:[1,3,3,2,1,1],G:[3,2,0,0,0,3],C:[null,3,2,0,1,0],Dm:[null,null,0,2,3,1],D:[null,null,0,2,3,2],E:[0,2,2,1,0,0],A:[null,0,2,2,2,0],Bm:[null,2,4,4,3,2]};
const NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const nm=m=>NAMES[((m%12)+12)%12];
const $=id=>document.getElementById(id);
let cur='Em',phase='idle',onsetT=0,best=null,rmsAvg=0,lastEnd=0,ctx,an,td,spec,stream,timer;

function targets(){return CH[cur].map((f,i)=>f==null?null:{i,midi:OPEN[i]+f,freq:440*Math.pow(2,(OPEN[i]+f-69)/12)})}

function drawBoard(res){
  const T=targets();let h='';
  for(let s=1;s<=6;s++){
    const i=6-s,t=T[i],w=(1.5+(s-1)*0.7).toFixed(1);
    if(!t){h+=`<div class="row mute" style="--w:${w}px"><span class="n">${s}. tel</span><span class="l"></span><span class="t">çalma</span></div>`;continue}
    let cls='',txt='';
    if(res){const n=res.notes[i];
      if(!n.det){cls='miss';txt='eksik'}
      else{const c=Math.round(n.cents);cls=Math.abs(c)>20?'warn':'ok';txt=(c>0?'+':'')+c+'¢'}}
    h+=`<div class="row ${cls}" style="--w:${w}px"><span class="n">${s}. tel <small>${nm(t.midi)}</small></span><span class="l"></span><span class="t">${txt}</span></div>`;
  }
  $('board').innerHTML=h;
}

function show(res,final){
  drawBoard(res);
  if(!res){$('pct').textContent='–';$('pct').style.color='';return}
  const p=res.pct;
  $('pct').textContent=p;
  $('pct').style.color=p>=85?'var(--good)':p>=60?'var(--warn)':'var(--bad)';
  if(!final)return;
  const miss=res.notes.filter(n=>n&&!n.det).map(n=>(6-n.i)+'. tel');
  let m=p>=90?'Temiz akor.':p>=70?'İyi, birkaç ayrıntı kaldı.':'Tekrar dene.';
  if(miss.length)m+=' Eksik: '+miss.join(', ')+'.';
  if(res.extras.length)m+=' Fazladan ses: '+res.extras.join(', ')+'.';
  if(res.avgCents>25)m+=' Gitar akortsuz olabilir.';
  $('msg').textContent=m;
}

function analyze(){
  an.getFloatFrequencyData(spec);
  const bh=ctx.sampleRate/an.fftSize,lo=Math.floor(70/bh),hi=Math.ceil(1500/bh);
  const sl=Array.from(spec.subarray(lo,hi)).sort((a,b)=>a-b),floor=sl[sl.length>>1];
  let mx=-Infinity;for(let i=lo;i<hi;i++)if(spec[i]>mx)mx=spec[i];
  if(!isFinite(floor)||!isFinite(mx))return null;
  const peak=(f,c)=>{
    const a=Math.max(lo,Math.round(f*Math.pow(2,-c/1200)/bh)),b=Math.round(f*Math.pow(2,c/1200)/bh);
    let k=a;for(let i=a;i<=b;i++)if(spec[i]>spec[k])k=i;
    let d=0;const y0=spec[k-1],y1=spec[k],y2=spec[k+1],den=y0-2*y1+y2;
    if(den<0)d=0.5*(y0-y2)/den;
    return{db:spec[k],f:(k+d)*bh};
  };
  const T=targets(),notes=[];let sum=0,cnt=0,cs=0,cc=0;
  T.forEach((t,i)=>{
    if(!t){notes.push(null);return}
    const p=peak(t.freq,50),p2=peak(t.freq*2,50);
    const det=p.db>floor+12||(p.db>floor+6&&p2.db>floor+14);
    const cents=1200*Math.log2(p.f/t.freq);
    const sc=det?1-0.3*Math.min(1,Math.abs(cents)/40):0;
    sum+=sc;cnt++;if(det){cs+=Math.abs(cents);cc++}
    notes.push({i,det,cents,sc});
  });
  const pcs=new Set(T.filter(Boolean).map(t=>t.midi%12)),extras=new Set();
  const a=Math.floor(80/bh),b=Math.ceil(1000/bh);
  for(let i=a;i<b;i++){
    if(!(spec[i]>spec[i-1]&&spec[i]>=spec[i+1]&&spec[i]>floor+16&&spec[i]>mx-25))continue;
    const den=spec[i-1]-2*spec[i]+spec[i+1],d=den<0?0.5*(spec[i-1]-spec[i+1])/den:0,f=(i+d)*bh;
    const m=69+12*Math.log2(f/440),pc=((Math.round(m)%12)+12)%12;
    if(pcs.has(pc))continue;
    let ex=false;
    for(const t of T){if(!t)continue;for(let h=1;h<=8;h++)if(Math.abs(1200*Math.log2(f/(h*t.freq)))<60)ex=true}
    if(!ex)extras.add(NAMES[pc]);
  }
  const pen=Math.min(30,extras.size*8);
  return{notes,extras:[...extras],avgCents:cc?cs/cc:0,pct:Math.round(Math.max(0,sum/cnt*100-pen))};
}

function tick(){
  const now=performance.now();
  an.getFloatTimeDomainData(td);
  let s=0;const n=2048,off=td.length-n;
  for(let i=off;i<td.length;i++)s+=td[i]*td[i];
  const rms=Math.sqrt(s/n);
  if(phase!=='capture'){
    if(rms>0.015&&rms>rmsAvg*2.5&&now-lastEnd>1200){phase='capture';onsetT=now;best=null;$('msg').textContent='Dinliyorum…'}
    rmsAvg=rmsAvg*0.8+rms*0.2;
  }else{
    const t=now-onsetT;
    if(t>250){const r=analyze();if(r&&(!best||r.pct>best.pct))best=r;if(best)show(best,false)}
    if(t>1500){phase='done';lastEnd=now;show(best,true)}
  }
}

async function start(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();
    an=ctx.createAnalyser();an.fftSize=32768;an.smoothingTimeConstant=0;
    ctx.createMediaStreamSource(stream).connect(an);
    td=new Float32Array(an.fftSize);spec=new Float32Array(an.frequencyBinCount);
    phase='idle';rmsAvg=0;lastEnd=0;timer=setInterval(tick,100);
    $('go').setAttribute('aria-pressed','true');$('go').textContent='Durdur';
    $('msg').textContent='Hazır. Akoru çal.';
  }catch(e){
    $('msg').textContent='Mikrofon açılamadı. Tarayıcıda mikrofon iznini ver ve sayfayı doğrudan tarayıcıda aç.';
  }
}
function stop(){
  clearInterval(timer);if(stream)stream.getTracks().forEach(t=>t.stop());if(ctx)ctx.close();
  phase='idle';$('go').setAttribute('aria-pressed','false');$('go').textContent='Dinlemeyi başlat';
  $('msg').textContent='Durdu.';
}
$('go').onclick=()=>$('go').getAttribute('aria-pressed')==='true'?stop():start();

function pick(c){
  cur=c;phase='idle';best=null;lastEnd=performance.now();
  document.querySelectorAll('.chips button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===c));
  show(null);
  if($('go').getAttribute('aria-pressed')==='true')$('msg').textContent='Hazır. Akoru çal.';
}
Object.keys(CH).forEach(c=>{
  const b=document.createElement('button');b.textContent=c;b.dataset.c=c;b.setAttribute('aria-pressed','false');
  b.onclick=()=>pick(c);$('chips').appendChild(b);
});
pick('Em');
</script>
</body>
</html>
